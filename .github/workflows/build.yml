name: Build oVirt TinyCore
permissions:
  issues: write
  pull-requests: write
  contents: write
on:
  push:
  pull_request:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install GenISOImage
        run: sudo apt update && sudo apt install -y genisoimage
      - name: Install QEMU and disk-build dependencies
        run: sudo apt update && sudo apt install -y qemu-system qemu-utils gocr libtirpc-dev imagemagick extlinux grub-efi-amd64-bin dosfstools fdisk ovmf
      - name: Run build script
        run: sudo ./build.sh
      - name: Move all artifacts to a single directory
        if: always()
        run: |
          mkdir output
          cp -av builddir/oVirtTinyCore*.iso output/
          cp -av qcowbuilddir/*.qcow2 output/
          cp -av src/busybox/busybox.tar.gz output/
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oVirtTinyCoreLinux
          if-no-files-found: error
          path: |
            output/*
      - name: Run tests
        run: ./test.sh
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ScreenShot
          if-no-files-found: error
          path: |
            oVirtTinyCore*.png
  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: oVirtTinyCoreLinux
          path: dist/
      - name: Create release
        run: gh release create "${GITHUB_REF##*/}" --generate-notes ./dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
